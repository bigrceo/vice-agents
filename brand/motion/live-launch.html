<!doctype html><html><head><meta charset=utf-8><style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;800&family=Yellowtail&display=swap');
@font-face{font-family:PD;src:url(file:///Users/rayane/leonida-agents-sol/src/app/fonts/Pricedown.otf)}
*{margin:0;box-sizing:border-box}html,body{width:1280px;height:720px;overflow:hidden;background:#0d0720;font-family:Inter}
.sc{position:absolute;inset:0;opacity:0}
.sky{position:absolute;inset:0;background:linear-gradient(180deg,#1a0838 0%,#5b1a7a 35%,#d8327a 62%,#ff8a3d 80%,#ffd36e 100%)}
.sun{position:absolute;left:640px;top:430px;width:520px;height:520px;margin:-260px;border-radius:50%;background:linear-gradient(#fff3b0,#ffb347 45%,#ff3d8b 100%);box-shadow:0 0 120px #ff3d8b99;
 -webkit-mask:repeating-linear-gradient(180deg,#000 0 26px,transparent 26px 34px);}
.grid{position:absolute;left:-50%;right:-50%;top:470px;height:500px;transform:perspective(380px) rotateX(62deg);transform-origin:top;
 background-image:linear-gradient(#ff5fa8 2px,transparent 2px),linear-gradient(90deg,#ff5fa8 2px,transparent 2px);background-size:80px 80px;filter:drop-shadow(0 0 6px #ff3d8b)}
.floor{position:absolute;left:0;right:0;top:470px;bottom:0;background:linear-gradient(#2a0b4a,#0d0720)}
.big{font-family:PD;color:#fff;text-align:center;position:absolute;width:100%;line-height:.9;text-shadow:0 8px 0 #0d0720,0 0 40px #ff3d8b}
.script{font-family:Yellowtail;color:#ffd36e;text-shadow:0 0 24px #ff3d8b;position:absolute;width:100%;text-align:center}
.card{position:absolute;width:250px;height:375px;border-radius:22px;overflow:hidden;border:3px solid #ffd36e;box-shadow:0 30px 60px #0009,0 0 40px #ff3d8b66;background:#222}
.card img{width:100%;height:100%;object-fit:cover}
.card .n{position:absolute;left:0;right:0;bottom:0;padding:44px 16px 14px;background:linear-gradient(transparent,#0d0720ee);color:#fff}
.card .n b{font-family:PD;font-size:34px;display:block;line-height:.9}.card .n i{font-style:normal;font-size:14px;color:#ffb3d6;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.coin{position:absolute;width:150px;height:150px;border-radius:50%;overflow:hidden;border:4px solid #fff;box-shadow:0 0 30px #ff3d8b,0 20px 40px #0008}
.coin img{width:100%;height:100%;object-fit:cover}
.map{position:absolute;inset:-10%;background:url(file:///Users/rayane/leonida-agents-sol/public/map/yanis-2k.jpg) center/cover}
.pin{position:absolute;width:64px;height:64px;border-radius:50%;border:3px solid #fff;overflow:hidden;box-shadow:0 0 0 6px #ff3d8b55,0 10px 20px #0008}
.pin img{width:100%;height:100%;object-fit:cover}
.ring{position:absolute;border:3px solid #ff5fa8;border-radius:50%}
.veil{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 30%,#0d0720cc 100%)}
</style></head><body>
<div class=sc id=s0><div class=sky></div><div class=sun id=sun></div><div class=floor></div><div class=grid id=grid></div><div class=script id=t0a style="top:150px;font-size:70px">Welcome to</div><div class=big id=t0b style="top:220px;font-size:190px">LEONIDA</div></div>
<div class=sc id=s1><div class=sky style="filter:brightness(.55)"></div><div class=floor style="top:520px"></div><div id=cards></div><div class=big id=t1 style="top:40px;font-size:96px">TEN AI LOCALS</div></div>
<div class=sc id=s2><div class=sky style="background:radial-gradient(circle at 50% 55%,#ff3d8b 0%,#5b1a7a 45%,#120530 100%)"></div><div id=coins></div><div class=big id=t2 style="top:270px;font-size:110px">THEY TRADE<br>THE TRENCHES</div></div>
<div class=sc id=s3><div class=map id=map></div><div class=veil></div><div id=pins></div><div class=big id=t3 style="top:560px;font-size:96px">THE MAP IS THE MARKET</div></div>
<div class=sc id=s4><div id=bg4 style="position:absolute;inset:-6%;background:url(file:///Users/rayane/leonida-agents-sol/public/locals/ocean-drive-bokeh.jpg) center/cover;filter:saturate(1.3)"></div><div style="position:absolute;inset:0;background:linear-gradient(180deg,#1a0838cc 0%,#5b1a7a99 40%,#d8327a88 75%,#ff8a3dbb 100%)"></div><div class=veil></div><div class=script id=t4a style="top:120px;font-size:60px">the town is live</div><div class=big id=t4 style="top:190px;font-size:170px">VICE AGENTS</div><div id=t4c style="position:absolute;top:400px;width:100%;text-align:center;color:#fff;font:800 40px Inter;letter-spacing:.04em;text-shadow:0 4px 20px #0d0720">viceagents.fun</div><div id=row4></div></div>
<style>.mini{position:absolute;top:500px;width:84px;height:84px;border-radius:50%;overflow:hidden;border:3px solid #ffd36e;box-shadow:0 10px 24px #0009}.mini img{width:100%;height:100%;object-fit:cover}</style>
<div class=sc id=s5><div class=sky style="background:radial-gradient(circle at 50% 45%,#7a1f8f 0%,#2a0b4a 55%,#0d0720 100%)"></div><div class=script id=t5a style="top:28px;font-size:54px">free to play, every week</div><div class=big id=t5 style="top:88px;font-size:84px">PICK THE WEEK'S WINNER</div><div id=faces></div><div class=big id=t5b style="top:560px;font-size:92px;color:#ffd36e;text-shadow:0 8px 0 #0d0720,0 0 50px #ffb347">WIN REAL TAKE-TWO STOCK</div></div>
<style>.face{position:absolute;width:128px;height:128px;border-radius:50%;overflow:hidden;border:4px solid #ffffff55;box-shadow:0 14px 30px #0008}.face img{width:100%;height:100%;object-fit:cover}.face.on{border-color:#ffd36e;box-shadow:0 0 0 6px #ffd36e,0 0 60px #ffb347}</style>
<script>
const R="/Users/rayane/leonida-agents-sol",IDS=["dez","ray","sloane","kiki","hollis","vince","marisol","tex","doc","lou"],NM=["Dez","Ray","Sloane","Kiki","Hollis","Vince","Marisol","Tex","Doc","Big Lou"],RL=["Street dealer","Beat cop","Ex-Wall St trader","Influencer","Airboat captain","Club owner","Real estate","Getaway driver","Back-alley doc","Pawn shop"];
const LOGOS=[0,2,3,6,7,9,11,12,13,15,16,17];
const $=id=>document.getElementById(id);
cards.innerHTML=IDS.map((id,i)=>'<div class=card id=c'+i+'><img src="file://'+R+'/public/agents/'+id+'-full.jpg"><div class=n><b>'+NM[i]+'</b><i>'+RL[i]+'</i></div></div>').join('');
coins.innerHTML=LOGOS.map((k,i)=>'<div class=coin id=k'+i+'><img src="file:///private/tmp/claude-501/-Users-rayane/29cdc05f-f3ef-4a06-b2d1-48a23e4d7e19/scratchpad/mo/logos/'+k+'.webp"></div>').join('');
const P=[[.31,.38],[.52,.30],[.44,.55],[.63,.47],[.25,.62],[.70,.25],[.38,.25],[.57,.66]];
pins.innerHTML=P.map((p,i)=>'<div class=ring id=r'+i+'></div><div class=pin id=p'+i+'><img src="file://'+R+'/public/agents/'+IDS[i]+'.jpg"></div>').join('');
const E=x=>x<0?0:x>1?1:1-Math.pow(1-x,3), clamp=x=>Math.max(0,Math.min(1,x)), win=(t,a,b,f=.35)=>clamp((t-a)/f)*clamp((b-t)/f);
row4.innerHTML=IDS.map((id,i)=>'<div class=mini id=m'+i+'><img src="file://'+R+'/public/agents/'+id+'.jpg"></div>').join('');
faces.innerHTML=IDS.map((id,i)=>'<div class=face id=f'+i+'><img src="file://'+R+'/public/agents/'+id+'.jpg"></div>').join('');
const SC={s1:[0,4],s2:[3.7,7],s3:[6.7,10.2],s5:[9.9,14.4],s4:[14.1,18]};
window.render=t=>{
 $('s0').style.opacity=0;
 for(const k in SC){const [a,b]=SC[k];$(k).style.opacity=k=='s1'?clamp((b-t)/.35):k=='s4'?clamp((t-a)/.35):win(t,a,b)}
 const u=t+0.4; IDS.forEach((_,i)=>{const c=$('c'+i),d=clamp((u-i*0.15)/0.55),x=140+i*205-u*110,y=210+Math.sin(i*1.7)*18+(1-E(d))*500,r=(i-4.5)*2.2*(1-E(d)*.6);
  c.style.transform='translate('+x+'px,'+y+'px) rotate('+r+'deg)';c.style.opacity=E(d)});
 $('t1').style.transform='translateY('+(-40*(1-E(u/.6)))+'px)';$('t1').style.opacity=clamp(u/.4);
 const v=t-3.7; LOGOS.forEach((_,i)=>{const a=i/LOGOS.length*6.283+v*0.9,rad=(380+60*Math.sin(i))*E(clamp(v/.8)),sc=.7+.3*Math.sin(a+1);
  const k=$('k'+i);k.style.transform='translate('+(565+Math.cos(a)*rad*1.25)+'px,'+(285+Math.sin(a)*rad*.62)+'px) scale('+sc+')';k.style.zIndex=Math.round(sc*10)});
 $('t2').style.transform='scale('+(0.8+0.2*E(v/.6)+0.02*v)+')';$('t2').style.opacity=clamp(v/.4);
 const w=t-6.7; $('map').style.transform='scale('+(1+w*0.05)+') translate('+(-w*8)+'px,'+(-w*5)+'px)';
 P.forEach((p,i)=>{const d=E(clamp((w-.2-i*.12)/.4)),x=p[0]*1280,y=p[1]*720+Math.sin(w*1.3+i)*6;const q=$('p'+i);q.style.transform='translate('+(x-32)+'px,'+(y-32)+'px) scale('+d+')';
  const rr=((w*0.9+i*.37)%1),r=$('r'+i),sz=40+rr*120;r.style.width=r.style.height=sz+'px';r.style.left=(x-sz/2)+'px';r.style.top=(y-sz/2)+'px';r.style.opacity=(1-rr)*d});
 $('t3').style.opacity=clamp((w-.5)/.4);$('t3').style.transform='translateY('+(30*(1-E((w-.5)/.5)))+'px)';
 // reward: faces pop in a 5x2 grid, a spotlight runs across them, slows down and lands
 const q=t-9.9; IDS.forEach((_,i)=>{const col=i%5,row=i/5|0,d=E(clamp((q-.15-i*.06)/.35)),f=$('f'+i);
  f.style.transform='translate('+(320+col*160-64)+'px,'+(250+row*150-64+(1-d)*60)+'px) scale('+d+')';f.style.opacity=d});
 const land=7, steps=q<0.9?-1:Math.min(27,Math.floor(Math.pow(clamp((q-0.9)/2.4),0.55)*27)), on=steps<0?-1:steps%10;
 IDS.forEach((_,i)=>$('f'+i).classList.toggle('on',i===on));
 $('t5a').style.opacity=clamp(q/.4);$('t5').style.opacity=clamp((q-.1)/.4);$('t5').style.transform='translateY('+(-30*(1-E(q/.5)))+'px)';
 const g=clamp((q-2.6)/.4);$('t5b').style.opacity=g;$('t5b').style.transform='scale('+(1.35-.35*E((q-2.6)/.5)+0.015*Math.max(0,q-3.1))+')';
 const z=t-14.1; $('t4a').style.opacity=clamp((z-.2)/.4);$('t4').style.transform='scale('+(1.3-.3*E(z/.7))+')';$('t4').style.opacity=clamp(z/.3);$('t4c').style.opacity=clamp((z-.8)/.4);$('bg4').style.transform='scale('+(1.08-0.02*z)+')';IDS.forEach((_,i)=>{const d=E(clamp((z-1-i*.07)/.35)),m=$('m'+i);m.style.left=(640-5*96+i*96+6)+'px';m.style.transform='translateY('+(40*(1-d))+'px)';m.style.opacity=d});
};
render(0);
</script></body></html>
