<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 56 56">
  <defs>
    <radialGradient id="g-bg" cx="50%" cy="30%" r="75%">
      <stop offset="0" stop-color="#2b2410"/>
      <stop offset="1" stop-color="#0a0906"/>
    </radialGradient>
    <linearGradient id="g-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset=".45" stop-color="#ffd54f"/>
      <stop offset="1" stop-color="#f2b800"/>
    </linearGradient>
    <linearGradient id="g-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7c21a"/>
      <stop offset="1" stop-color="#b58600"/>
    </linearGradient>
    <linearGradient id="g-side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9a300"/>
      <stop offset="1" stop-color="#7d5c00"/>
    </linearGradient>
    <filter id="g-sh" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>
  <rect width="56" height="56" fill="url(#g-bg)"/>
  <ellipse cx="29" cy="45" rx="18" ry="4" fill="#000" opacity=".6" filter="url(#g-sh)"/>
  <!-- lingot du bas -->
  <path d="M9 42 L13.5 34.5 H37.5 L42 42 Z" fill="url(#g-front)"/>
  <path d="M13.5 34.5 L20 28.5 H44 L37.5 34.5 Z" fill="url(#g-top)"/>
  <path d="M37.5 34.5 L44 28.5 L48.5 36 L42 42 Z" fill="url(#g-side)"/>
  <!-- lingot du haut, décalé -->
  <path d="M12 33 L16.5 25.5 H37 L41.5 33 Z" fill="url(#g-front)"/>
  <path d="M16.5 25.5 L23 19.5 H43.5 L37 25.5 Z" fill="url(#g-top)"/>
  <path d="M37 25.5 L43.5 19.5 L48 27 L41.5 33 Z" fill="url(#g-side)"/>
  <!-- reflets -->
  <path d="M18 24.8 L23.6 19.9 H41.8" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="1" stroke-linecap="round"/>
  <path d="M15 33.8 L20.6 28.9 H30" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="1" stroke-linecap="round"/>
</svg>
