<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 56 56">
  <defs>
    <radialGradient id="o-bg" cx="50%" cy="30%" r="75%">
      <stop offset="0" stop-color="#241d12"/>
      <stop offset="1" stop-color="#0a0906"/>
    </radialGradient>
    <radialGradient id="o-body" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#4a4a4a"/>
      <stop offset=".45" stop-color="#151515"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="o-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset=".4" stop-color="#f5be09" stop-opacity="0"/>
      <stop offset="1" stop-color="#f5be09" stop-opacity=".85"/>
    </linearGradient>
    <filter id="o-sh" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
    <filter id="o-soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>
  <rect width="56" height="56" fill="url(#o-bg)"/>
  <ellipse cx="28" cy="47" rx="13" ry="3.5" fill="#000" opacity=".7" filter="url(#o-sh)"/>
  <!-- la goutte -->
  <path id="o-drop" d="M28 8 C22 17.5 15.5 24.5 15.5 32.5 A12.5 12.5 0 0 0 40.5 32.5 C40.5 24.5 34 17.5 28 8 Z" fill="url(#o-body)"/>
  <!-- liseré ambre, lumière rasante à droite -->
  <path d="M28 8 C22 17.5 15.5 24.5 15.5 32.5 A12.5 12.5 0 0 0 40.5 32.5 C40.5 24.5 34 17.5 28 8 Z" fill="none" stroke="url(#o-rim)" stroke-width="1.4"/>
  <!-- reflets -->
  <ellipse cx="23.5" cy="26" rx="3" ry="5.5" transform="rotate(-18 23.5 26)" fill="#fff" opacity=".85" filter="url(#o-soft)"/>
  <ellipse cx="24" cy="36.5" rx="1.6" ry="1.1" fill="#fff" opacity=".45"/>
</svg>
